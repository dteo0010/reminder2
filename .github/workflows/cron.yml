name: Trigger renewal check

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours — adjust as you like
  workflow_dispatch:  # lets you trigger it manually from GitHub's Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call cron route
        run: |
          curl -f -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
          https://reminder2-nu.vercel.app/api/cron/check-renewal